<div class="tool-modal world-clock-modal" id="worldClockModal" role="dialog" aria-modal="true" aria-labelledby="worldClockTitle" hidden>
  <div class="modal-backdrop" data-close-world-clock></div>
  <section class="world-clock-panel">
    <div class="world-clock-header">
      <div>
        <p class="section-kicker">EVERYDAY TOOL</p>
        <h2 id="worldClockTitle">World Clock</h2>
      </div>
      <button class="modal-close" type="button" data-close-world-clock aria-label="Close world clock">×</button>
    </div>

    <div class="clock-add-row">
      <label class="sr-only" for="clockCity">Add a city</label>
      <select id="clockCity" class="unit-select">
        <option value="Asia/Singapore">Singapore</option>
        <option value="Asia/Tokyo">Tokyo</option>
        <option value="Asia/Dubai">Dubai</option>
        <option value="Asia/Kolkata">New Delhi</option>
        <option value="Europe/London">London</option>
        <option value="Europe/Paris">Paris</option>
        <option value="America/New_York">New York</option>
        <option value="America/Los_Angeles">Los Angeles</option>
        <option value="Australia/Sydney">Sydney</option>
        <option value="Pacific/Auckland">Auckland</option>
        <option value="Africa/Johannesburg">Johannesburg</option>
        <option value="America/Sao_Paulo">São Paulo</option>
      </select>
      <button type="button" id="addClockCity" class="clock-add-button">Add city</button>
    </div>

    <div class="clock-list" id="clockList"></div>

    <section class="clock-meeting-planner" aria-labelledby="clockMeetingTitle">
      <div class="clock-meeting-heading">
        <h3 id="clockMeetingTitle">Find a meeting time</h3>
        <p>Find meeting slots that fit every saved city's working hours.</p>
      </div>
      <form class="clock-meeting-form" id="clockMeetingForm">
        <label class="clock-meeting-field" for="clockMeetingDate">
          <span>Date (your local time)</span>
          <input id="clockMeetingDate" type="date" required>
        </label>
        <label class="clock-meeting-field" for="clockMeetingStart">
          <span>Workday starts</span>
          <input id="clockMeetingStart" type="time" value="09:00" required>
        </label>
        <label class="clock-meeting-field" for="clockMeetingEnd">
          <span>Workday ends</span>
          <input id="clockMeetingEnd" type="time" value="17:00" required>
        </label>
        <label class="clock-meeting-field" for="clockMeetingDuration">
          <span>Meeting length</span>
          <select id="clockMeetingDuration" class="unit-select">
            <option value="15">15 minutes</option>
            <option value="30" selected>30 minutes</option>
            <option value="45">45 minutes</option>
            <option value="60">60 minutes</option>
          </select>
        </label>
        <button class="clock-meeting-submit" type="submit">Find times</button>
      </form>
      <p class="clock-meeting-hint">Your work hours and meeting length are saved on this device. Times include daylight-saving changes.</p>
      <div class="clock-meeting-results">
        <p class="clock-meeting-status" id="clockMeetingStatus" role="status" aria-live="polite">
          Choose a date and working hours to find shared times.
        </p>
        <div class="clock-meeting-slots" id="clockMeetingSlots"></div>
        <button class="clock-meeting-copy" id="clockMeetingCopy" type="button" disabled>
          Copy selected time
        </button>
      </div>
    </section>
  </section>
</div>
