<div class="tool-modal" id="calculatorModal" role="dialog" aria-modal="true" aria-labelledby="calculatorTitle" hidden>
  <div class="modal-backdrop" data-close-modal></div>
  <section class="calculator-panel">
    <div class="calculator-header">
      <div>
        <p class="section-kicker">EVERYDAY TOOL</p>
        <h2 id="calculatorTitle">Calculator</h2>
      </div>
      <button class="modal-close" type="button" data-close-modal aria-label="Close calculator">×</button>
    </div>

    <div class="calculator-display" aria-live="polite">
      <div class="calculation-preview" id="calculationPreview"></div>
      <output class="calculator-output" id="calculatorOutput">0</output>
    </div>

    <section class="calculator-history" aria-labelledby="historyTitle">
      <div class="history-heading">
        <h3 id="historyTitle">Recent calculations</h3>
        <button type="button" id="clearCalculatorHistory" class="history-clear">Clear</button>
      </div>
      <div id="calculatorHistory" class="history-list" aria-live="polite"></div>
    </section>

    <div class="calculator-grid" id="calculatorGrid">
      <button type="button" data-action="clear" class="calc-key calc-muted" aria-label="AC, clear calculator" aria-keyshortcuts="Escape">AC</button>
      <button type="button" data-action="sign" class="calc-key calc-muted" aria-label="Change sign">±</button>
      <button type="button" data-action="percent" class="calc-key calc-muted" aria-label="Percent">%</button>
      <button type="button" data-value="/" class="calc-key calc-operation" aria-label="Divide">÷</button>

      <button type="button" data-value="7" class="calc-key">7</button>
      <button type="button" data-value="8" class="calc-key">8</button>
      <button type="button" data-value="9" class="calc-key">9</button>
      <button type="button" data-value="*" class="calc-key calc-operation">×</button>

      <button type="button" data-value="4" class="calc-key">4</button>
      <button type="button" data-value="5" class="calc-key">5</button>
      <button type="button" data-value="6" class="calc-key">6</button>
      <button type="button" data-value="-" class="calc-key calc-operation">−</button>

      <button type="button" data-value="1" class="calc-key">1</button>
      <button type="button" data-value="2" class="calc-key">2</button>
      <button type="button" data-value="3" class="calc-key">3</button>
      <button type="button" data-value="+" class="calc-key calc-operation">+</button>

      <button type="button" data-action="backspace" class="calc-key calc-muted" aria-label="Delete last character" aria-keyshortcuts="Backspace">⌫</button>
      <button type="button" data-value="0" class="calc-key">0</button>
      <button type="button" data-value="." class="calc-key">.</button>
      <button type="button" data-action="equals" class="calc-key calc-equals" aria-label="Calculate result" aria-keyshortcuts="Enter =">=</button>
    </div>
  </section>
</div>
