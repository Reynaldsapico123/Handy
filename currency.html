<div class="tool-modal currency-modal" id="currencyModal" role="dialog" aria-modal="true" aria-labelledby="currencyTitle" hidden>
  <div class="modal-backdrop" data-close-currency></div>
  <section class="currency-panel">
    <div class="currency-header">
      <div>
        <p class="section-kicker">EVERYDAY TOOL</p>
        <h2 id="currencyTitle">Currency Exchange</h2>
      </div>
      <button class="modal-close" type="button" data-close-currency aria-label="Close currency exchange">×</button>
    </div>

    <div class="currency-fields">
      <div class="currency-box">
        <label for="currencyAmount">Amount</label>
        <input id="currencyAmount" type="number" min="0" step="any" value="100">
        <select id="currencyFrom" aria-label="Currency to convert from"></select>
      </div>
      <button type="button" id="currencySwap" class="currency-swap" aria-label="Swap currencies">⇅</button>
      <div class="currency-box">
        <label for="currencyResult">Converted</label>
        <div class="currency-result-row">
          <output id="currencyResult">—</output>
          <button type="button" class="currency-copy-result" id="currencyCopyResult" aria-label="Copy conversion result" disabled>Copy</button>
        </div>
        <select id="currencyTo" aria-label="Currency to convert to"></select>
      </div>
    </div>

    <div class="currency-rate-footer">
      <div class="currency-status" id="currencyStatus" role="status" aria-live="polite">
        Rates will load when you open this tool.
      </div>
      <button type="button" class="currency-refresh" id="currencyRefresh" aria-label="Refresh rates">
        <span aria-hidden="true">↻</span> Refresh rates
      </button>
    </div>
    <section class="currency-shortcuts" aria-labelledby="currencyShortcutsTitle">
      <div class="currency-shortcuts-heading">
        <h3 id="currencyShortcutsTitle">Saved pairs</h3>
        <button type="button" id="currencySavePair" class="currency-save-pair">Save pair</button>
      </div>
      <p class="currency-shortcuts-empty" id="currencyFavoritesEmpty">No saved pairs yet.</p>
      <div class="currency-favorites" id="currencyFavorites"></div>
    </section>
    <section class="currency-recent" aria-labelledby="currencyRecentTitle">
      <div class="currency-recent-heading">
        <h3 id="currencyRecentTitle">Recent conversions</h3>
        <button type="button" id="currencyClearRecent" class="currency-clear-recent" disabled>Clear</button>
      </div>
      <p class="currency-recent-empty" id="currencyRecentEmpty">No recent conversions yet.</p>
      <div class="currency-recent-list" id="currencyRecentList"></div>
    </section>
  </section>
</div>
