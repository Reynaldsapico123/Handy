name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handy-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Audit accessibility and performance
        run: npm run audit:quality

      - name: Audit visual regressions
        run: npm run audit:visual

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        run: |
          set -e
          output="$(npx wrangler pages deploy dist --project-name=handy)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s\n' "$output" | grep -Eo 'https://[a-z0-9-]+\.handy-6on\.pages\.dev' | head -n 1)"
          if [ -z "$preview_url" ]; then
            echo "Cloudflare deployment URL not found in Wrangler output." >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Record release metadata
        env:
          PREVIEW_URL: ${{ steps.cloudflare.outputs.preview_url }}
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');const match=html.match(/<meta name=\"handy-build\" content=\"([a-f0-9]{12})\">/i);if(!match)throw new Error('Build fingerprint missing');const record={url:process.env.PREVIEW_URL,buildId:match[1],deployedAt:new Date().toISOString(),primaryUrl:'https://handy-6on.pages.dev',verification:{status:'pending',checks:[]}};fs.writeFileSync('deployment.json',JSON.stringify(record,null,2)+'\n');"

      - name: Verify deployed preview
        env:
          HANDY_DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.preview_url }}
        run: npm run smoke:cloudflare

      - name: Audit mobile Lighthouse performance
        env:
          HANDY_DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.preview_url }}
        run: npm run audit:lighthouse

      - name: Audit mobile tool interaction performance
        env:
          HANDY_DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.preview_url }}
        run: npm run audit:interactions

      - name: Verify Firefox and WebKit compatibility
        env:
          HANDY_DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.preview_url }}
        run: npm run smoke:browsers

      - name: Monitor live deployment
        run: npm run monitor:deployment

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: handy-deployment-${{ github.run_id }}
          path: |
            deployment.json
            tests/visual-diffs/
          if-no-files-found: warn
          retention-days: 90
