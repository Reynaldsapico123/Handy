name: Deployment monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handy-deployment-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Monitor live deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Monitor primary deployment
        run: npm run monitor:deployment

      - name: Upload monitoring evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: handy-deployment-monitor-${{ github.run_id }}
          path: deployment.json
          if-no-files-found: warn
          retention-days: 90
