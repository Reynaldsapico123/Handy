name: Monitor Handy production

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_run:
    workflows:
      - Deploy to Cloudflare
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handy-production-monitor
  cancel-in-progress: false

jobs:
  health:
    name: Check production availability and headers
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check production health
        run: npm run health:production
